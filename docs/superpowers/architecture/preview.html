<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>架构图预览</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #f5f5f5; }
    section { background: #fff; padding: 16px; margin-bottom: 24px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h2 { margin-top: 0; font-size: 1rem; color: #333; }
    img, object { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    p.note { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <p class="note">若 SVG 双击无法预览：用 Chrome / Edge 打开本文件（或把下方图片拖进浏览器）。插入 Word 可用「插入 → 图片」选 .svg，或浏览器缩放后截图。</p>
  <section>
    <h2>图 2-1-1</h2>
    <img src="fig-2-1-1-system-architecture.svg" alt="系统总体逻辑架构" />
  </section>
  <section>
    <h2>图 2-1-2</h2>
    <img src="fig-2-1-2-query-flow.svg" alt="问答数据流" />
  </section>
  <section>
    <h2>图 2-1-3</h2>
    <img src="fig-2-1-3-tech-stack.svg" alt="技术栈与模块映射" />
  </section>
</body>
</html>
